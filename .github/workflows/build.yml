name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      roothide:
        description: '同时构建 RootHide (roothide/theos, arm64e) 版本'
        required: false
        default: 'false'
        type: choice
        options: [ 'false', 'true' ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 快速结构自检：不需要 Mac，20 秒内就能把"文件被写坏/契约对不上"挡在昂贵的
  # macOS 构建之前。macOS 任务是 10 倍计费，先跑这个能省很多时间。
  # ---------------------------------------------------------------------------
  checks:
    name: 结构自检（无需 Mac）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行 scripts/preflight.py
        run: python3 scripts/preflight.py --verbose

      - name: 关键文件与维护脚本格式
        run: |
          set -eu
          for f in Makefile entitlements.plist \
                   layout/DEBIAN/control layout/DEBIAN/postinst layout/DEBIAN/prerm \
                   layout/Library/LaunchDaemons/com.dsh.iagent.daemon.plist \
                   layout/Library/MobileSubstrate/DynamicLibraries/iagent.plist \
                   layout/usr/share/iagent/web/index.html \
                   layout/usr/share/iagent/web/app.js \
                   layout/usr/share/iagent/web/style.css \
                   .github/workflows/build.yml; do
            test -f "$f" || { echo "缺少文件: $f"; exit 1; }
          done
          # dpkg 不接受 CRLF 的维护脚本
          for f in layout/DEBIAN/postinst layout/DEBIAN/prerm; do
            head -n 1 "$f" | grep -q '^#!' || { echo "$f 缺少 shebang"; exit 1; }
            if grep -q "$(printf '\r')" "$f"; then echo "$f 含 CRLF，dpkg 会报错"; exit 1; fi
          done
          echo "文件齐全，DEBIAN 脚本是 LF 且有 shebang"

  # ---------------------------------------------------------------------------
  # Dopamine / rootless 构建：主产物。rootless v2 的 rpath 同时包含
  # /var/jb/* 与 @loader_path/.jbroot/*，所以同一份二进制在 RootHide 上也能解析依赖。
  # ---------------------------------------------------------------------------
  rootless:
    name: iAgent (rootless · Dopamine)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos 与 iOS SDK
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

          # theos/sdks 整仓约 1GB，用稀疏检出只取一个 SDK。
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          SDK=$(git -C /tmp/sdks ls-tree --name-only HEAD | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -n 1 || true)
          if [ -z "${SDK:-}" ]; then
            SDK=$(git -C /tmp/sdks ls-tree --name-only HEAD | grep -E '^iPhoneOS.*\.sdk$' | tail -n 1)
          fi
          echo "使用 SDK: $SDK"
          git -C /tmp/sdks sparse-checkout set "$SDK"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/sdks/$SDK" "$THEOS/sdks/"
          ls "$THEOS/sdks"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 安装打包与签名工具（dpkg / ldid）
        run: |
          # Theos 自己不带 ldid，签名时会调用 PATH 里的 `ldid`（否则报 command not found）。
          command -v ldid >/dev/null 2>&1 || brew install ldid || echo "::warning::ldid 安装失败，签名会失败"
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg || echo "::warning::dpkg 安装失败，改用 ar/tar 校验包内容"
          echo "ldid: $(command -v ldid || echo 缺失)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo 缺失)"

      - name: 显示工具链版本
        run: |
          uname -m
          xcodebuild -version
          ldid -v 2>&1 | head -n 2 || true

      # make 会在第一个出错的文件上停下，一轮只能看到一个文件的问题。这里先对每个
      # 源文件单独做语法检查（-fsyntax-only，不产出目标文件），一次列出全部错误。
      - name: 全量语法检查
        continue-on-error: true
        run: |
          set -u
          SDK=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | head -n 1)
          echo "sysroot: $SDK"
          fail=0
          for f in daemon/*.m shared/*.m tweak/*.m; do
            out=$(clang -fsyntax-only -fobjc-arc \
                    -I"$PWD/shared" -I"$PWD/daemon" -I"$PWD/tweak" \
                    -isysroot "$SDK" -target arm64-apple-ios15.0 \
                    -fmodules-cache-path=/tmp/iag-modules \
                    "$f" 2>&1 | grep -E ' (error|fatal error):' || true)
            if [ -n "$out" ]; then
              echo "===== $f"
              echo "$out" | head -n 40
              fail=1
            fi
          done
          if [ "$fail" = "0" ]; then echo "全部源文件语法检查通过"; fi
          exit "$fail"

      - name: 构建 .deb
        run: |
          set -e
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/prerm
          # -k：某个文件报错也继续编译其余文件，一次 CI 就能看到全部编译错误。
          make -k clean && make -k package FINALPACKAGE=1
          ls -l packages/

      - name: 检查包内容
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n 1)
          echo "package: $DEB"

          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb -I "$DEB"
            dpkg-deb -c "$DEB" | head -n 40
            LIST=$(dpkg-deb -c "$DEB")
            # 控制成员不在 -c 的列表里（-c 只列 data.tar），单独解出来检查。
            rm -rf /tmp/ctl && dpkg-deb -e "$DEB" /tmp/ctl
          else
            # 没有 dpkg 就从 ar 归档里取 data.tar / control.tar 再列目录（macOS 自带 ar/tar）
            mkdir -p /tmp/inspect && cd /tmp/inspect
            ar x "$OLDPWD/$DEB"
            ls -l
            LIST=$(tar -tvf data.tar.*)
            echo "$LIST" | head -n 40
            rm -rf /tmp/ctl && mkdir -p /tmp/ctl && tar -xf control.tar.* -C /tmp/ctl
          fi

          echo "$LIST" | grep -q 'usr/bin/iagentd'              || { echo "iagentd 缺失"; exit 1; }
          echo "$LIST" | grep -q 'DynamicLibraries/iagent.dylib' || { echo "tweak 缺失"; exit 1; }
          echo "$LIST" | grep -q 'DynamicLibraries/iagent.plist' || { echo "注入过滤器 plist 缺失"; exit 1; }
          echo "$LIST" | grep -q 'usr/share/iagent/web/index.html' || { echo "Web UI 缺失"; exit 1; }
          echo "$LIST" | grep -q 'usr/share/iagent/web/app.js'   || { echo "Web UI app.js 缺失"; exit 1; }
          echo "$LIST" | grep -q 'LaunchDaemons/com.dsh.iagent.daemon.plist' || { echo "LaunchDaemon 缺失"; exit 1; }

          # 维护脚本必须可执行，否则 dpkg 不会运行 postinst
          ls -l /tmp/ctl
          test -f /tmp/ctl/control || { echo "control 缺失"; exit 1; }
          test -x /tmp/ctl/postinst || { echo "postinst 没有执行位"; exit 1; }
          test -x /tmp/ctl/prerm    || { echo "prerm 没有执行位"; exit 1; }
          # postinst 里引用的路径前缀必须与包的 scheme 一致
          grep -q '/var/jb/usr/bin/iagentd' /tmp/ctl/control && echo "control 里的 daemon 路径正确" || true
          echo "包内容与维护脚本检查通过"

      - name: 校验包元数据
        if: hashFiles('packages/*.deb') != ''
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n 1)
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb -f "$DEB"
            ARCH=$(dpkg-deb -f "$DEB" Architecture)
            test "$ARCH" = "iphoneos-arm64" || { echo "Architecture 应为 iphoneos-arm64，实际 $ARCH"; exit 1; }
            PKG=$(dpkg-deb -f "$DEB" Package)
            test "$PKG" = "com.dsh.iagent" || { echo "Package 名不对: $PKG"; exit 1; }
            # 字段不能重复（layout/DEBIAN/control 里写 Installed-Size 会和 Theos
            # 自动追加的那行撞车，dpkg 会拒绝安装）。
            DUP=$(dpkg-deb -f "$DEB" | sed -n 's/^\([A-Za-z][A-Za-z-]*\):.*/\1/p' | sort | uniq -d)
            test -z "$DUP" || { echo "control 有重复字段: $DUP"; exit 1; }
            dpkg-deb -f "$DEB" Depends | grep -q 'firmware (>= 15.0)' || { echo "Depends 缺少 firmware (>= 15.0)"; exit 1; }
            echo "包元数据检查通过"
          else
            echo "::warning::没有 dpkg-deb，跳过元数据校验"
          fi

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: iagent-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos/**/*.log
            packages/**/*.log
          if-no-files-found: ignore

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
          body: |
            iAgent —— 原生 iOS AI Agent 越狱插件。

            安装：下载 `.deb` 后用 Sileo / Zebra 打开，或 `dpkg -i`。
            支持 iOS 15 及以上；Dopamine（rootless）与 RootHide 均可安装。

            > 未在真机上验证过，请先在可恢复的设备上试。

  # ---------------------------------------------------------------------------
  # RootHide 构建：需要 roothide 的 Theos 分支与 arm64e。该分支节奏与上游不同步，
  # 所以保持非阻塞（continue-on-error），只在手动触发且选择 roothide=true 时运行。
  # ---------------------------------------------------------------------------
  roothide:
    name: iAgent (RootHide · arm64e)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' && inputs.roothide == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 roothide/theos 与 iOS SDK
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos-roothide"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"

          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          SDK=$(git -C /tmp/sdks ls-tree --name-only HEAD | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -n 1 || true)
          if [ -z "${SDK:-}" ]; then
            SDK=$(git -C /tmp/sdks ls-tree --name-only HEAD | grep -E '^iPhoneOS.*\.sdk$' | tail -n 1)
          fi
          echo "使用 SDK: $SDK"
          git -C /tmp/sdks sparse-checkout set "$SDK"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/sdks/$SDK" "$THEOS/sdks/"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 安装打包与签名工具
        run: |
          command -v ldid >/dev/null 2>&1 || brew install ldid || true
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg || true

      - name: 构建 .deb
        run: |
          set -e
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/prerm
          make -k clean && make -k package FINALPACKAGE=1 IAG_ROOTHIDE=1 ARCHS=arm64e
          ls -l packages/
          DEB=$(ls packages/*.deb | head -n 1)
          command -v dpkg-deb >/dev/null 2>&1 && dpkg-deb -f "$DEB" Package Architecture Version Depends || true

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: iagent-roothide-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30
